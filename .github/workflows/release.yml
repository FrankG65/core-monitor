# Builds the "Full" package (embedded Python, all programs precompiled) on a Windows runner, tests it and
# attaches it to a GitHub release. Started by hand: Actions -> Release -> Run workflow -> enter the version tag.
# If the release does not exist yet, it is created (tag on the current main) with docs/release_notes.md as text.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v1.1"
        required: true

permissions:
  contents: write

jobs:
  full-package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Python packages (for building and testing)
        run: python -m pip install --disable-pip-version-check -r requirements.txt numba

      - name: Build and test from source
        shell: cmd
        run: |
          dotnet build csharp\MandelBench -c Release -o csharp\bin --nologo -v q || exit /b 1
          pushd rust\mandelbench && cargo build --release --quiet && popd || exit /b 1
          call native\build.bat || exit /b 1
          python tools\selftest.py --require numba,numpy,csharp,csharp_simd,rust,rust_simd,c,c_simd,cpp,cpp_simd,asm

      - name: Build the Full package
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\export.ps1 -Variante Full

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $zip = Get-ChildItem export -Filter "CoreMonitor_Full_*.zip" | Select-Object -First 1
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $zip.FullName --clobber
          } else {
            gh release create $env:TAG $zip.FullName --target main --title "Core Monitor $($env:TAG.TrimStart('v'))" --notes-file docs/release_notes.md
          }
